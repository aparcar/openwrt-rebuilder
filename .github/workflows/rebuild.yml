name: Rebuild firmware

on:
  workflow_dispatch:
    inputs:
      release:
        description: "OpenWrt release to rebuild (e.g. SNAPSHOT, 24.10.0, 24.10-SNAPSHOT)"
        required: false
        default: "SNAPSHOT"
        type: string
      targets:
        description: "JSON list of targets to rebuild"
        required: false
        default: '["mediatek/filogic", "x86/64", "x86/generic"]'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release }}
  cancel-in-progress: true

jobs:
  firmware:
    name: ${{ inputs.release }} - ${{ matrix.target }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    env:
      RELEASE: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Slug target name
        run: echo "target_slug=$(echo '${{ matrix.target }}' | tr '/' '_')" >> "$GITHUB_ENV"

      - name: Cache OpenWrt git repository
        uses: actions/cache@v5
        with:
          path: ./build/${{ env.RELEASE }}/.git
          key: openwrt-git-${{ env.RELEASE }}-${{ github.sha }}
          restore-keys: |
            openwrt-git-${{ env.RELEASE }}-
            openwrt-git-

      - name: Cache downloads
        uses: actions/cache@v5
        with:
          path: ./build/${{ env.RELEASE }}/dl
          key: openwrt-dl-${{ env.RELEASE }}-${{ env.target_slug }}-${{ github.run_id }}
          restore-keys: |
            openwrt-dl-${{ env.RELEASE }}-${{ env.target_slug }}-
            openwrt-dl-${{ env.RELEASE }}-
            openwrt-dl-

      - name: Cache feeds
        uses: actions/cache@v5
        with:
          path: |
            ./build/${{ env.RELEASE }}/feeds
            ./build/${{ env.RELEASE }}/package/feeds
          key: openwrt-feeds-${{ env.RELEASE }}-${{ env.target_slug }}-${{ github.run_id }}
          restore-keys: |
            openwrt-feeds-${{ env.RELEASE }}-${{ env.target_slug }}-
            openwrt-feeds-${{ env.RELEASE }}-
            openwrt-feeds-

      - name: Rebuild ${{ matrix.target }}
        run: |
          uv run openwrt-rebuilder --verbose firmware \
            --target "${{ matrix.target }}" \
            --release "$RELEASE" \
            --build-dir "./build/$RELEASE" \
            --output "./out/$RELEASE/${{ matrix.target }}"

      # The rebuilt artifacts (plus build logs) are the deliverable; comparing
      # them against downloads.openwrt.org is the caller's job (rebuilderd).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: firmware-${{ env.RELEASE }}-${{ env.target_slug }}
          path: out/
          if-no-files-found: warn
